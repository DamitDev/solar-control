services:
  postgres:
    image: postgres:16-alpine
    container_name: solar-control-db
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar
      POSTGRES_DB: solar_gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar_gateway"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - solar-network

  redis:
    image: redis:7-alpine
    container_name: solar-control-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - solar-network

  solar-control:
    build: .
    container_name: solar-control
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - MANAGEMENT_API_KEY=${MANAGEMENT_API_KEY:-change-me-management}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - DATABASE_URL=postgresql://solar:solar@postgres:5432/solar_gateway
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - solar-network

volumes:
  pgdata:

networks:
  solar-network:
    driver: bridge
