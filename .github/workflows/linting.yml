# Ruff lint — mirrors orchestrator PR checks.

name: Code Linting Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ruff-lint-check:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          # Pinned: ruff 0.16 changed the default rule set and flags the
          # codebase's existing style (170 errors). See PR #60.
          pip install ruff==0.15.14

      - name: Lint with Ruff
        run: ruff check app
